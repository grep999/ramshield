[workspace]
members = [
    ".",
    "crates/ramshield-compliance",
    "crates/ramshield-config",
    "crates/ramshield-consensus",
    "crates/ramshield-detection",
    "crates/ramshield-enforcement",
    "crates/ramshield-forecasting",
    "crates/ramshield-learning",
    "crates/ramshield-metrics",
    "crates/ramshield-protocol",
    "crates/ramshield-storage",
    "crates/ramshield-types",
    "crates/ramshield-xdp",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "warn"
unused_imports = "warn"

[package]
name    = "ramshield"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "ramshield"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "ramshield-cli"
path = "src/cli.rs"

[lib]
name = "ramshield"
path = "src/lib.rs"

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
full = ["tokio/full", "tracing-subscriber/env-filter", "tracing-subscriber/fmt", "tower-http/cors", "clap/derive", "otel", "xdp"]
xdp = ["dep:aya", "dep:ramshield-xdp"]

[dependencies]
tokio             = { version = "1", features = ["full"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
dashmap           = "5"
ahash             = "0.8"
arc-swap          = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crc32fast         = "1"
lz4_flex          = "0.11"
thiserror         = "1"
anyhow            = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
clap              = { version = "4", default-features = false, features = ["std", "derive"] }
toml              = "0.8"
num_cpus          = "1"
axum              = "0.7"
tower             = { version = "0.5", features = ["util"] }
tower-http        = { version = "0.5", features = ["cors"] }
futures-util      = "0.3"
tokio-stream      = "0.1"
ctrlc             = "3"
sysinfo           = "0.29"
shlex = "2.0.1"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
opentelemetry = { version = "0.21", optional = true }
opentelemetry_sdk = { version = "0.21", optional = true, features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.22", optional = true }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
aya = { version = "0.12", optional = true }
ramshield-xdp = { path = "crates/ramshield-xdp", version = "0.1.0", default-features = false, features = ["elf"], optional = true }
ramshield-types = { path = "crates/ramshield-types", version = "0.1.0" }
ramshield-config = { path = "crates/ramshield-config", version = "0.1.0" }
ramshield-storage = { path = "crates/ramshield-storage", version = "0.1.0" }
ramshield-metrics = { path = "crates/ramshield-metrics", version = "0.1.0" }
ramshield-detection = { path = "crates/ramshield-detection", version = "0.1.0" }
ramshield-enforcement = { path = "crates/ramshield-enforcement", version = "0.1.0", default-features = false }
ramshield-forecasting = { path = "crates/ramshield-forecasting", version = "0.1.0" }

[dev-dependencies]
serial_test = "3"
proptest = "1"
