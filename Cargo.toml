[workspace]
members = [
    ".",
    "crates/ramshield-config",
    "crates/ramshield-detection",
    "crates/ramshield-enforcement",
    "crates/ramshield-forecasting",
    "crates/ramshield-metrics",
    "crates/ramshield-protocol",
    "crates/ramshield-storage",
    "crates/ramshield-types",
    "crates/ramshield-xdp",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "warn"
unused_imports = "warn"

[package]
name    = "ramshield"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "ramshield"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "ramshield-cli"
path = "src/cli.rs"

[lib]
name = "ramshield"
path = "src/lib.rs"

[[bench]]
name = "hot_paths"
path = "benches/hot_paths.rs"
harness = false

[features]
default = []
full = ["tokio/full", "tracing-subscriber/env-filter", "tracing-subscriber/fmt", "tower-http/cors", "clap/derive", "xdp"]
xdp = ["dep:aya", "dep:ramshield-xdp", "ramshield-enforcement/xdp"]

[dependencies]
tokio             = { version = "1", features = ["full"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
dashmap           = "6"
ahash             = "0.8"
arc-swap          = "1"
bytes               = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crc32fast         = "1"
thiserror         = "2"
anyhow            = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
clap              = { version = "4", default-features = false, features = ["std", "derive"] }
toml              = "1"
axum              = "0.7"
tower             = { version = "0.5", features = ["util"] }
tower-http        = { version = "0.5", features = ["cors"] }
sysinfo           = "0.39"
memmap2           = "0.9"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
aya = { version = "0.14", optional = true }
ramshield-xdp = { path = "crates/ramshield-xdp", version = "0.1.0", default-features = false, features = ["elf"], optional = true }
ramshield-types = { path = "crates/ramshield-types", version = "0.1.0" }
ramshield-config = { path = "crates/ramshield-config", version = "0.1.0" }
ramshield-storage = { path = "crates/ramshield-storage", version = "0.1.0" }
ramshield-metrics = { path = "crates/ramshield-metrics", version = "0.1.0" }
ramshield-detection = { path = "crates/ramshield-detection", version = "0.1.0" }
ramshield-enforcement = { path = "crates/ramshield-enforcement", version = "0.1.0", default-features = false }
ramshield-forecasting = { path = "crates/ramshield-forecasting", version = "0.1.0" }
ramshield-protocol = { path = "crates/ramshield-protocol", version = "0.1.0" }

[dev-dependencies]
serial_test = "3"
proptest = "1"
