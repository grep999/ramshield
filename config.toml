# config.baseline.toml — THE canonical template. Every config in this repo
# derives from it; hand-rolled per-harness configs are forbidden.
# Covers every field of Config (crates/ramshield-config). All features
# enabled, detection-priority tuned. The IPC key below is a public development
# credential only; every real deployment MUST replace it through the installer
# or RAMSHIELD_IPC__AUTH_KEYS before exposing any untrusted local principal.
#
# Harnesses (suite e2e, stress) generate scratch configs from this file with
# surgical overrides only (ports, wal.dir, xdp toggle). Never copy-paste a
# whole config again — one source of truth.

[engine]
# 0 = all cores (tokio auto). Pin an integer only on fixed-shape nodes.
worker_threads = 0
# Pin the engine's RAM budget explicitly (0 = schema default 512). 1024 =
# safe default for small VMs; raise for production traffic.
ram_limit_mb = 1024
# Lock-free shard fanout for the store: 256 = 2^8, power of two.
shard_count = 256

[detection]
# ── per-IP rate gate ────────────────────────────────────────────────────
rps_threshold = 500
rate_window_secs = 10
promote_min_events = 4
# Relative / small-scale detector: experimental, opt-in, qualify before production.
relative_enabled = false
relative_factor = 5.0
relative_floor_rps = 3.0
relative_min_samples = 8
relative_min_breaches = 3
emergency_burst_threshold = 500
# ── decision cadence (detection-first tuning, 4c18c78) ──────────────────
# 25ms = decision-sample quantum per worker: halves block-decision latency.
# flush 0.4-2ms at 4096 events ≈ 6-8% of a worker core — inside budget.
batch_window_ms = 25
batch_max_events = 4096
# Staleness backstop: 250ms — CUSUM arms ~2s faster, pulse windows sample
# 4x/s. Idle cost ~3 near-empty flushes/s (microseconds).
pre_aggs_flush_interval_ms = 250
# Force-flush trigger on shared pre_aggs: 1M holds the full working set
# (bounded ~100 MB) — 8192 thrashed flushes under IP fanout.
pre_aggs_max_size = 1_000_000
# Sizing rule: bloom_bits ≈ 20 × (promoted IPs per 8s epoch) for ~1% FP.
# 8M bits covers ~400k promotions/epoch; engine self-heals a mis-sized
# value with an early epoch clear + warn.
bloom_bits = 8_000_000
# ── subnet layer ────────────────────────────────────────────────────────
# Hot-filter floor for the subnet scan. MUST sit at or below the CGNAT
# gate floor (hosts > 64) or the filter is stricter than the gate; and for
# v4 /24 keys the max distinct hosts is 254, so 800 (the old "tuned" value)
# made the v4 subnet layer structurally unreachable. 64 = gate floor.
subnet_batch_threshold = 64
subnet_batch_min_events = 500
subnet_window_threshold = 12
batch_block_enabled = true
block_ttl_secs = 300
subnet_burst_ttl_secs = 60
# ── pulse (persistent low-rate) ─────────────────────────────────────────
pulse_window_secs = 5
pulse_threshold_samples = 3

# ── L7 / HTTP2 ─────────────────────────────────────────────────────────
l7_enabled = false
l7_rps_threshold = 500
l7_http2_min_streams = 32
l7_http2_reset_ratio_pct = 80
l7_block_ttl_secs = 300
# Example route rule (disabled by default):
# [[detection.l7_rules]]
# route_hash = 123456789
# method = "Post"
# max_rps = 50
# max_http2_reset_ratio_pct = 70
# max_latency_us = 250000
# cost_weight = 8.0
# baseline_latency_us = 100000
# max_effective_rps = 100

[ipc]
tcp_addr = "127.0.0.1:7890"
max_connections = 1024
max_line_length = 262_144
max_connection_bytes = 1_048_576
read_timeout_ms = 5000
write_timeout_ms = 5000
connection_idle_timeout_ms = 30_000
# Development-only loopback credential. It is intentionally public and MUST be
# replaced in any deployment where an untrusted local principal exists.
# Every IPC frame remains HMAC-authenticated even on loopback.
auth_keys = ["k1:6f9aac85819f184df6617252c2a92fe356069c5e5909ea95fd6ad8c54b0b8a7b"]
key_roles = [{ key_id = "k1", role = "Admin" }]
require_auth = false
# Refuse state-mutating requests without verified principal.
require_auth_for_mutations = false

[dashboard]
enabled = true
http_addr = "127.0.0.1:9999"
block_log_size = 1_000
# admin_password_hash: set via overlay (argon2 PHC string) before exposing
# beyond loopback. tls_enabled/cookie_secure: flip when behind HTTPS.
# Argon2 PHC hash of admin password. Generate with argon2 CLI.
# Set before exposing beyond loopback.
admin_password_hash = "$argon2id$v=19$m=65536,t=3,p=4$y4pwwR3t9KAhG407+IM7bg$2io7C02ET4ea+L/Zb7dLQn+IrsX7yppU2OX4fwLHWoI"
require_auth_for_config = false
session_ttl_secs = 28_800
max_login_attempts = 50
max_password_length = 1024
trusted_proxies = []
tls_enabled = false
# Force/disable Secure flag on session cookies. None = derive from bind addr.
cookie_secure = false

[wal]
enabled = true
dir = "/tmp/ramshield-wal"
# GroupCommit = fsync amortized across concurrent commits; Flush = fdatasync
# per write (use "flush" only when every block must survive power loss).
durability = "GroupCommit"
compress = true
seg_max_bytes = 67_108_864
retention_max_bytes = 1_073_741_824

[forecasting]
enabled = true
ewma_alpha = 0.3
hw_beta = 0.1
hw_gamma = 0.1
seasonality_period = 60
anomaly_zscore = 3.0
min_entropy = 4.5

[xdp]
# Kernel dataplane: needs cap_net_admin,cap_perfmon,cap_bpf on the binary
# (setcap re-applied after every rebuild). Fails gracefully → in-band.
enabled = true
interface = "wlp2s0"
mode = "skb"
require_native_for_autonomous = true
require_rss_rebalance = true
# Example cloud/LB node identity prefixes; keep empty unless this host receives
# traffic through an overlay whose outer source is not the real client.
trusted_overlay_cidrs = []
allow_inband_fallback = true


# ── Fleet mesh ─────────────────────────────────────────────────────────
[mesh]
enabled = false
node_id = 1
listen_addr = "127.0.0.1:7900"
peers = []
# Compatibility-only local key; mesh traffic uses the per-edge secrets in
# peer_auth_keys. Keep in a local overlay, not this template.
auth_key = ""

# ── Upstream saturation escalation ────────────────────────────────────
[upstream]
enabled = false
interface = "veth0"
link_capacity_mbps = 0
saturation_pct = 90
poll_ms = 1000
webhook_url = ""
cooldown_secs = 60
bgp_mode = "none"
bgp_fifo = ""
protected_prefix = ""
bgp_community = ""


[autonomous]
# First-line cold-start packet protection in XDP. Production baseline enabled.
enabled = false
syn_pps_per_cpu = 25000
udp_pps_per_cpu = 50000
packet_pps_per_cpu = 200000
window_ms = 100

# ── Native host observation ────────────────────────────────────────────
[native_ingest]
# ponytail: eth0 doesn't exist on this host (eno1/wlp2s0) — disable until
# interface is auto-detected; upgrade path: derive from default route.
enabled = false
interface = "veth0"
max_events_per_sec = 20000

# ── Kernel SYN proxy ──────────────────────────────────────────────────
[synproxy]
# ponytail: disabled until running with CAP_NET_ADMIN / root.
enabled = false
ports = [22, 53, 80, 443]
mss = 1460
wscale = 7
max_connections_per_source = 128
max_connections_total = 16384
new_connections_per_second = 50
new_connection_burst = 100
new_connections_total_per_second = 2000
new_connection_total_burst = 4000
