# config.toml
[engine]
shard_count = 256
worker_threads = 0
ram_limit_mb = 14512

[ipc]
tcp_addr = "127.0.0.1:7890"  # Set to the port you want
max_connections = 1000000

[dashboard]
enabled = true
max_login_attempts = 50
max_password_length = 1024
# Default port is 9999 (see crates/ramshield-config/src/lib.rs:282).
# Override here only if you need a non-default bind (e.g., in containers
# with port-mapping collisions). To match the README and SECURITY docs,
# leave this commented out.
# http_addr = "127.0.0.1:9999"

[forecasting]
enabled = true
ewma_alpha = 0.3
hw_beta = 0.1
hw_gamma = 0.1
seasonality_period = 60
anomaly_zscore = 3.0
min_entropy = 4.5

[xdp]
enabled = false
interface = "lo"
mode = "skb"
