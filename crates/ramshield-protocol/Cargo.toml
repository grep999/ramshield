[package]
name = "ramshield-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "ramshield_protocol"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ahash = "0.8"
ramshield-types = { path = "../ramshield-types", version = "0.1.0" }

[dev-dependencies]
proptest = "1"


[lints]
workspace = true