[package]
name = "ramshield-consensus"
version = "0.1.0"
edition = "2024"

[dependencies]
ramshield-types = { path = "../ramshield-types" }
ramshield-storage = { path = "../ramshield-storage" }
ramshield-config = { path = "../ramshield-config" }
openraft = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
