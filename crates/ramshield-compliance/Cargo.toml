[package]
name = "ramshield-compliance"
version = "0.1.0"
edition = "2024"

[dependencies]
ramshield-types = { path = "../ramshield-types" }
ramshield-storage = { path = "../ramshield-storage" }
ramshield-config = { path = "../ramshield-config" }
ramshield-metrics = { path = "../ramshield-metrics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha3 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
[lints]
workspace = true
