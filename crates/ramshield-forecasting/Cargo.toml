[package]
name = "ramshield-forecasting"
version = "0.1.0"
edition = "2024"

[dependencies]
ramshield-types = { path = "../ramshield-types" }
ramshield-storage = { path = "../ramshield-storage" }
ramshield-metrics = { path = "../ramshield-metrics" }
ramshield-config = { path = "../ramshield-config" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
