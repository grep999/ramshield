[package]
name = "ramshield-xdp"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
# ponytail: aya is only needed for include_bytes_aligned!; the ELF build is the
# crate's entire purpose. Manager/XdpManager path deleted — AyaXdpApplier in
# ramshield-enforcement is the single live consumer of BPF_ELF.
aya = { version = "0.12", default-features = false }

[features]
default = []
elf = []

[build-dependencies]
aya-build = "0.2"

[lints]
workspace = true
