[package]
name = "ramshield-xdp"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
ramshield-types = { path = "../ramshield-types", optional = true }
ramshield-storage = { path = "../ramshield-storage", optional = true }
ramshield-config = { path = "../ramshield-config", optional = true }
aya = { version = "0.12", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"

[features]
default = []
# Legacy XdpManager path needs storage/config; BPF_ELF export needs only aya.
elf = []
manager = ["dep:ramshield-types", "dep:ramshield-storage", "dep:ramshield-config"]
full = ["elf", "manager"]

[build-dependencies]
aya-build = "0.2"

[lints]
workspace = true
