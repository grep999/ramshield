[package]
name = "ramshield-mesh"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

[lints]
workspace = true
