[package]
name = "ramshield-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
ramshield-types = { path = "../ramshield-types" }
ahash = "0.8"
dashmap = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
lz4_flex = "0.11"
crc32fast = "1"
thiserror = "2"
anyhow = "1.0"
crossbeam-queue = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
