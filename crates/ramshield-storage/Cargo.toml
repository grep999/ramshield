[package]
name = "ramshield-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ramshield-types = { path = "../ramshield-types" }
ahash = "0.8"
dashmap = "6.1"
serde = { version = "1", features = ["derive"] }
