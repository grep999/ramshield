[package]
name = "ramshield-enforcement"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ahash = "0.8"
ramshield-metrics = { path = "../ramshield-metrics", version = "0.1.0" }
ramshield-types = { path = "../ramshield-types", version = "0.1.0" }
ramshield-storage = { path = "../ramshield-storage", version = "0.1.0" }
ramshield-mesh = { path = "../ramshield-mesh", version = "0.2.0", optional = true }
ramshield-xdp = { path = "../ramshield-xdp", version = "0.1.0", default-features = false, features = ["elf"], optional = true }
aya = { version = "0.14", optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
libc = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1"
serial_test = "3"

[features]
mesh = ["dep:ramshield-mesh"]
xdp = ["dep:aya", "dep:ramshield-xdp", "dep:libc"]

[lints]
workspace = true
