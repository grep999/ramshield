[package]
name = "ramshield-enforcement"
version = "0.1.0"
edition = "2024"

[dependencies]
ramshield-metrics = { path = "../ramshield-metrics" }
ramshield-types = { path = "../ramshield-types" }
ramshield-storage = { path = "../ramshield-storage" }
ramshield-xdp = { path = "../ramshield-xdp", default-features = false, features = ["elf"], optional = true }
aya = { version = "0.14", optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"

[dev-dependencies]
proptest = "1"
serial_test = "3"

[features]
xdp = ["dep:aya", "dep:ramshield-xdp"]

[lints]
workspace = true
