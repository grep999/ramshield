[package]
name = "ramforge"
version = "0.1.0"
edition = "2024"
description = "Independent adaptive brute-force login detection with AI-evasion-resistant behavioral analysis"
license = "MIT"

# Own workspace root — fully independent of the parent RamShield workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "ramforge"
path = "src/lib.rs"

[[bin]]
name = "ramforge"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1