<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RamShield // Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
<style>
:root {
  --bg-app: #080B10;
  --bg-surface: #10151D;
  --bg-elevated: #161E29;
  --bg-hover: #1C2633;
  --border-subtle: #273241;
  --border-focus: #344254;
  --text-primary: #E8EEF5;
  --text-secondary: #A0ADBD;
  --text-muted: #718096;
  --brand-mint: #67F5B3;
  --brand-cyan: #55D9F2;
  --brand-violet: #A69BFF;
  --status-healthy: #67F5B3;
  --status-warning: #F6C66A;
  --status-critical: #FF6B78;
  --status-info: #70B8FF;
}
html { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background-color: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  width: 100%; max-width: 360px;
  background: #10131a;
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 36px 30px 30px;
  box-shadow: 0 24px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.2);
}
.brand {
  display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 16px;
}
.brand svg { width: 24px; height: 24px; }
.brand svg path { fill: none; stroke: var(--brand-mint); stroke-width: 1.6; }
h1 { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--text-primary); }
.sub { text-align: center; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; }
label { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
input {
  width: 100%; padding: 12px 14px; margin-bottom: 16px;
  background: #08090d; color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  border-radius: 6px; font-family: inherit; font-size: 14px; letter-spacing: 1px;
  transition: border-color .18s, box-shadow .18s;
}
input:focus { outline: none; border-color: var(--brand-cyan); box-shadow: 0 0 0 3px rgba(87, 245, 179, .08); }
button {
  width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: #080B10;
  background: var(--brand-cyan); transition: background .12s ease;
}
button:hover { background: var(--brand-mint); }
button:active { transform: translateY(1px); }
.err { font-size: 12px; color: var(--status-critical); text-align: center; margin-bottom: 14px; }
.foot { margin-top: 20px; text-align: center; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3.5v5.2c0 5-3.2 9.3-8 11.3-4.8-2-8-6.3-8-11.3V5.5L12 2z"/><path d="M8.2 12.2l2.6 2.6 5-5.4"/></svg>
    <h1>RamShield</h1>
  </div>
  <div class="sub">Operations Console</div>
  {{ERR}}
  <form method="post" action="/login">
    <label for="password">Admin password</label>
    <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <div class="foot">HMAC-authenticated IPC · Argon2id · per-IP lockout</div>
</div>
</body>
</html>
