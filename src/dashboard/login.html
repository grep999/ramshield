<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RamShield // Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
<style>
  :root {
    color-scheme: dark;
    --bg-base: #080b10;
    --bg-surface: #10151d;
    --bg-elevated: #161e29;
    --border-subtle: #273241;
    --border-focus: #55d9f2;
    --text-primary: #e8eef5;
    --text-secondary: #a0adbd;
    --text-muted: #7b899c;
    --brand-primary: #67f5b3;
    --accent-cyan: #55d9f2;
    --status-critical: #ff6b78;
    --mono-font: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans-font: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; background: var(--bg-base); }
  body {
    font-family: var(--sans-font);
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: #10131a;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 36px 30px 30px;
    box-shadow: 0 24px 48px rgba(0,0,0,.55);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .brand svg { width: 24px; height: 24px; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; color: var(--text-primary); }
  .sub { text-align: center; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; }

  {{ERR}}

  label { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    background: #08090d;
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.5px;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  input:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(85, 217, 242, 0.1); }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--brand-primary);
    background: transparent;
    transition: all 0.12s ease;
  }
  button:hover { background: var(--brand-primary); color: #07130e; }
  button:active { transform: translateY(1px); }

  .err { font-size: 12px; color: var(--status-critical); text-align: center; margin-bottom: 14px; }
  .foot { margin-top: 20px; text-align: center; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }

  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3.5v5.2c0 5-3.2 9.3-8 11.3-4.8-2-8-6.3-8-11.3V5.5L12 2z"/><path d="M8.2 12.2l2.6 2.6 5-5.4"/></svg>
    <h1>RamShield</h1>
  </div>
  <div class="sub">Operations Console</div>
  {{ERR}}
  <form method="post" action="/login">
    <label for="password">Admin password</label>
    <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <div class="foot">HMAC-authenticated IPC · Argon2id · per-IP lockout</div>
</div>
</body>
</html>
