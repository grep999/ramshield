# config.stress.toml — generated from config.baseline.toml (surgical overrides only)
# Used by .github/workflows/subnet-stress.yml (scripts/subnet_stress.py).
# Overrides vs baseline:
#   [detection] subnet_batch_threshold=50, subnet_batch_min_events=100
#     The stress script sends 60 unique hosts / 120 events per /24 (see
#     subnet_stress.py header). Baseline 64/500 would not arm swarm_hint
#     (60 < 64), so the probe asserts threshold=50/min_events=100.
#   [dashboard] enabled=true — the script reads /api/snapshot for counters.
#   [wal] enabled=false, [xdp] enabled=false — CI has no privileged BPF/WAL.
# Loopback binds keep the Config::validate fail-closed public-bind rule quiet.

[engine]
worker_threads = 0
ram_limit_mb = 14512
shard_count = 256

[detection]
rps_threshold = 500
rate_window_secs = 10
promote_min_events = 4
emergency_burst_threshold = 500
batch_window_ms = 25
batch_max_events = 4096
pre_aggs_flush_interval_ms = 250
pre_aggs_max_size = 1_000_000
bloom_bits = 8_000_000
# Swarm gate that subnet_stress.py probes: 60 hosts / 120 events per /24.
subnet_batch_threshold = 50
subnet_batch_min_events = 100
subnet_window_threshold = 12
batch_block_enabled = true
block_ttl_secs = 300
subnet_burst_ttl_secs = 60
pulse_window_secs = 5
pulse_threshold_samples = 3

[ipc]
tcp_addr = "127.0.0.1:7890"
max_connections = 1024
max_line_length = 262_144
max_connection_bytes = 1_048_576
read_timeout_ms = 5000
write_timeout_ms = 5000
connection_idle_timeout_ms = 30_000
# This fixture binds IPC to loopback only and is used exclusively by CI stress.
# Do not copy this auth setting into production configurations.
auth_keys = []
require_auth = false

[dashboard]
enabled = true
http_addr = "127.0.0.1:9999"
block_log_size = 1_000
session_ttl_secs = 28_800
max_login_attempts = 50
max_password_length = 1024
trusted_proxies = []
tls_enabled = false

[wal]
enabled = false
dir = "/var/lib/ramshield/wal"
durability = "GroupCommit"
compress = true
seg_max_bytes = 67_108_864
retention_max_bytes = 1_073_741_824

[forecasting]
enabled = false
ewma_alpha = 0.3
hw_beta = 0.1
hw_gamma = 0.1
seasonality_period = 60
anomaly_zscore = 3.0
min_entropy = 4.5

[xdp]
enabled = false
interface = "eth0"
mode = "skb"
