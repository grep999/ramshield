name: lint-no-unwrap

on:
  push:
    branches: [prod-up]
  pull_request:

jobs:
  no-unwrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Unit test the filter against adversarial fixtures
        run: python3 .github/scripts/filter_test/test_filter.py

      - name: Scan production source for .unwrap() / .expect()
        run: |
          set -euo pipefail
          HITS=$(rg -n --type rust \
            --glob '!tests/**' \
            --glob '!**/tests/**' \
            --glob '!**/*.test.rs' \
            --glob '!**/test_*.rs' \
            --glob '!**/*_test.rs' \
            -e '\.unwrap\s*\(' \
            -e '\.expect\s*\(' \
            src/ || true)
          # Filter hits using the same Python that the test harness exercises.
          # ci_filter_testcode.py reads source files, finds #[cfg(test)] block
          # line ranges via brace-depth tracking, drops hits inside them.
          # Adversarial fixture tests in .github/scripts/filter_test/ guard
          # against the regressions found in 6a125b0 (broken brace-on-rg-output).
          FILTERED=$(printf '%s\n' "$HITS" | python3 .github/scripts/ci_filter_testcode.py .)
          COUNT=$(printf '%s\n' "$FILTERED" | grep -c . || true)
          echo "unwrap/expect hits in production src/: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Production code contains .unwrap() or .expect(). Forbidden by AGENTS.md §3."
            printf '%s\n' "$FILTERED"
            exit 1
          fi
