name: RamShield Advanced Features

on:
  push:
    branches: [feature/ramshield-advanced]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Rustfmt + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain, not stable. rust-toolchain.toml pins
      # nightly-2026-08-29, and rustup's directory override makes that the
      # toolchain every cargo in this tree uses - so installing stable
      # leaves `cargo fmt` looking for a cargo-fmt that the pinned
      # toolchain does not have. ci.yml already does it this way.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings -A clippy::pedantic

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      # The primary workflow's test-target policy (ci.yml:133): the test
      # step does not use --all-targets, because --all-targets also
      # executes [[bench]] harness=false binaries as tests (F28). The
      # benchmark targets are built and checked by the bench job below.
      - run: cargo build --workspace --locked --all-targets --verbose
      - run: cargo test --workspace --locked --verbose

  # ponytail: Linux only. RamShield is an eBPF/XDP ingress daemon, so a
  # macOS or Windows build proves nothing about the product; the jobs only
  # ever reported failures nobody was going to fix. Add a non-Linux runner
  # back when the product supports it.

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit 2>/dev/null || true
      - run: cargo audit --no-yanked

  doc:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - run: cargo doc --no-deps --document-private-items
      - uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: target/doc

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      # No `|| true`: a benchmark build failure must fail the job. The
      # build passes on this tree - verified locally with
      # `cargo bench --no-run` - so the mask only hid the failures it
      # was there to hide.
      - run: cargo bench --no-run
