name: CI

on:
  push:
    branches: [main, develop, master, audit-branch]
  pull_request:
    branches: [main, develop, master, audit-branch]

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - run: cargo clippy --workspace --locked --features full --all-targets -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - run: cargo check --all-targets --all-features --locked

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - run: cargo build --all-targets --all-features --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      # --all-targets also executes [[bench]] harness=false binaries.
      # benches/hot_paths.rs is a 100k-iter workload, not a test; it hung
      # CI run 35391325896 for >10 min on bench_batch_aggregate.
      # Match review_pipeline.sh: unit/integration tests only.
      - run: cargo test --workspace --locked --features full
      - name: Verify C SHM ABI
        run: scripts/verify_shm_header.sh
