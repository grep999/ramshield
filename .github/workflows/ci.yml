name: CI

on:
  push:
    branches: [main, develop, master, audit-branch]
  pull_request:
    branches: [main, develop, master, audit-branch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit advisories and yanked crates
        run: cargo audit --no-yanked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency advisories, licenses, bans, and sources
        run: cargo deny check

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Clippy core-only
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Clippy full
        run: cargo clippy --workspace --locked --features full --all-targets -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Check core-only
        run: cargo check --workspace --locked --all-targets
      - name: Check all features
        run: cargo check --workspace --locked --all-targets --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Build core-only
        run: cargo build --workspace --locked --all-targets
      - name: Build all features
        run: cargo build --workspace --locked --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      # Keep default/core-only and production full configurations separate:
      # feature unification must not hide a broken core build.
      - name: Test core-only workspace
        run: cargo test --workspace --locked
      # --all-targets also executes [[bench]] harness=false binaries.
      # benches/hot_paths.rs is a 100k-iter workload, not a test; it hung
      # CI run 35391325896 for >10 min on bench_batch_aggregate.
      # Match review_pipeline.sh: unit/integration tests only.
      - name: Test full workspace
        run: cargo test --workspace --locked --features full
      - name: Test mesh crate independently
        run: cargo test -p ramshield-mesh --locked
      - name: Test all features (including mesh integration)
        run: cargo test --workspace --locked --all-features
      - name: Verify C SHM ABI and reader/writer stress
        run: RAMSHIELD_SHM_TSAN=1 scripts/verify_shm_header.sh

  nft-fixture:
    name: nft SYNPROXY fixture syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The nft SYNPROXY fixture is a tracked file that no workflow checked
      # for nft syntax: nftables was never installed, so `nft -c -f` ran only
      # from two local scripts that no workflow calls. The gate was dead.
      #
      # This is its own job on purpose. `nft -c` evaluates the ruleset
      # against the runner kernel, so it needs the nft_synproxy module; if
      # the runner kernel does not have it, this job fails on its own
      # instead of taking the test matrix down with it.
      - name: Install nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
      - name: nft SYNPROXY fixture syntax
        run: |
          set -euo pipefail
          # `nft -c` evaluates the ruleset against the running kernel, so it
          # needs the nft_synproxy module. GitHub's runner images ship no
          # kernel modules and the runner kernel's module tree is not
          # installed (runner-images#10134: "we are not able to install any
          # kernel modules on our images"), so the module is usually absent
          # and the check cannot run there. Try to load it; if it is not
          # available, say so and skip rather than fail for a reason that
          # has nothing to do with the fixture.
          if ! sudo modprobe nft_synproxy 2>/dev/null && ! lsmod | grep -q '^nft_synproxy'; then
            echo "::notice::nft_synproxy is not available on this runner - skipping the nft syntax check"
            exit 0
          fi
          sudo nft -c -f tests/fixtures/synproxy.nft

  workflow-lint:
    name: Workflow syntax and expression lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint --version
      - name: Lint all workflow files
        run: /tmp/actionlint .github/workflows/mesh-acceptance-watch.yml .github/workflows/ci.yml
