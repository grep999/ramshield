name: CI

on:
  push:
    branches: [main, develop, master, audit-branch]
  pull_request:
    branches: [main, develop, master, audit-branch]

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit advisories and yanked crates
        run: cargo audit --no-yanked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency advisories, licenses, bans, and sources
        run: cargo deny check

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Clippy core-only
        run: cargo clippy --workspace --locked --all-targets --exclude ramshield-mesh -- -D warnings
      - name: Clippy full
        run: cargo clippy --workspace --locked --features full --all-targets --exclude ramshield-mesh -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Check core-only
        run: cargo check --workspace --locked --all-targets --exclude ramshield-mesh
      - name: Check all features
        run: cargo check --workspace --locked --all-targets --exclude ramshield-mesh --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Build core-only
        run: cargo build --workspace --locked --all-targets --exclude ramshield-mesh
      - name: Build all features
        run: cargo build --workspace --locked --all-targets --exclude ramshield-mesh --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Test core-only workspace
        run: cargo test --workspace --locked --exclude ramshield-mesh
      - name: Test full workspace
        run: cargo test --workspace --locked --features full --exclude ramshield-mesh
