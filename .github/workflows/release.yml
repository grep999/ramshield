name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: {tool: cargo-audit}
      - uses: taiki-e/install-action@v2
        with: {tool: cargo-deny}
      - uses: sigstore/cosign-installer@v3.8.1
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Verify release identity
        run: test "${GITHUB_REF_NAME}" = "v$(scripts/release_version.sh)"
      - name: Rust release gates
        run: |
          scripts/verify_shm_header.sh
          cargo fmt --all -- --check
          cargo check --workspace --locked --all-targets --features full
          cargo clippy --workspace --locked --all-targets --features full -- -D warnings
          cargo test --workspace --locked --features full
          cargo audit --no-yanked
          cargo deny check
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          cargo build --release --locked --features full
          tar -czf "ramshield-${V}-x86_64-unknown-linux-gnu.tar.gz" -C target/release ramshield ramshield-cli
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo build --release --locked --features full --target aarch64-unknown-linux-gnu
          tar -czf "ramshield-${V}-aarch64-unknown-linux-gnu.tar.gz" -C target/aarch64-unknown-linux-gnu/release ramshield ramshield-cli
      - name: Generate SBOM
        run: python3 scripts/generate_sbom.py --version "${GITHUB_REF_NAME#v}" -o "ramshield-${GITHUB_REF_NAME#v}.spdx.json"
      - name: Checksums and per-artifact sidecars
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ramshield-*.tar.gz > SHA256SUMS
          for f in ramshield-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - name: Sign release archives
        env: {COSIGN_YES: 'true'}
        shell: bash
        run: |
          set -euo pipefail
          for f in ramshield-*.tar.gz; do
            cosign sign-blob --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with: {subject-path: 'ramshield-*.tar.gz'}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ramshield-*.tar.gz
            ramshield-*.tar.gz.sig
            ramshield-*.tar.gz.pem
            ramshield-*.tar.gz.sha256
            ramshield-*.spdx.json
            SHA256SUMS
            config.baseline.toml
            LICENSE
