name: Temporary learning crate formatter
on:
  push:
    branches:
      - feat/passive-discovery-stage0
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/passive-discovery-stage0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format learning crate
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ramshield-discovery/src
          git commit -m "style(learning): apply rustfmt"
          git push origin HEAD:feat/passive-discovery-stage0
