name: XDP netns smoke gate
# Month 5/6 gate: real kernel attach + drop in a network namespace.
# Requires CAP_NET_ADMIN/CAP_BPF (GitHub ubuntu-latest has passwordless
# sudo). Build recipe mirrors release.yml exactly (nightly-2026-08-29 +
# bpf-linker v0.11.1).
on: [push, pull_request]
jobs:
  xdp-netns-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-29
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version
      - name: Build with XDP
        run: cargo build --release --locked --features full
      - name: Run netns XDP smoke
        run: sudo bash scripts/xdp_netns_smoke.sh target/release/ramshield
      - name: Diagnose on failure
        if: failure()
        run: |
          uname -a
          bpftool version || true
          sudo dmesg | tail -50 || true
