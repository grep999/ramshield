name: Question
description: Ask a usage or design question about RamShield
title: "[Q] <title>"
labels: ["triage", "question"]
body:
  - type: markdown
    attributes:
      value: |
        Scope: on-host L3/L4 only. No L7, WAF, bot management, or uplink repair.
        Check docs/FAQ.md and docs/BOUNDARIES.md before asking.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: One question per issue.
      placeholder: What does ... do when ...?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to achieve? What have you read already?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RamShield Version
      description: Output of `ramshield --version` or commit SHA.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Kernel, distro, architecture, deployment (systemd/Docker/bare metal).
