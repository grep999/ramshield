# RamShield + Envoy Production Template
# Save as envoy.yaml and run: envoy -c envoy.yaml

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 80
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: ramshield_backend
                  timeout: 30s
          http_filters:
          - name: envoy.filters.http.router
  clusters:
  - name: ramshield_backend
    connect_timeout: 5s
    type: LOGICAL_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: ramshield_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                # Your APPLICATION backend (edit host/port). RamShield is an
                # out-of-band observer/enforcer — never route HTTP to its
                # IPC port (7890, newline-delimited JSON).
                port_value: 8080
    health_checks:
    - timeout: 5s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: "/healthz"
        expected_statuses:
        - start: 200
          end: 299
