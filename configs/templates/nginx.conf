# RamShield + Nginx Production Template
# Place in /etc/nginx/sites-available/ramshield.conf
#
# IMPORTANT: this proxies to YOUR APPLICATION BACKEND. RamShield is an
# out-of-band observer/enforcer, not an HTTP reverse proxy. Do NOT point
# this at RamShield's IPC port (7890) — that port speaks newline-delimited
# JSON (ramshield_protocol::Message), not HTTP.

upstream ramshield_backend {
    server 127.0.0.1:8080;  # your application backend; edit host/port
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Pass real client IP to RamShield
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;

    location / {
        proxy_pass http://ramshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
