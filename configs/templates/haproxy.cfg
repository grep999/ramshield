# RamShield + HAProxy Production Template
# Place in /etc/haproxy/haproxy.cfg

global
    maxconn 65535
    user haproxy
    group haproxy
    log /dev/log local0 info
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout check 5s

frontend ramshield_frontend
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/ramshield.pem
    default_backend ramshield_backend
    option forwardfor header X-Real-IP

backend ramshield_backend
    # Your APPLICATION backend. RamShield (out-of-band observer/enforcer) is
    # NOT an HTTP proxy — never point traffic at its IPC port (7890, JSON).
    server app 127.0.0.1:8080 check inter 2s fall 3 rise 2
    option httpchk GET /healthz
    http-check expect status 200
