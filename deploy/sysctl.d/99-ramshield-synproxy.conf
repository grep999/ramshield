# RamShield SYNPROXY prerequisites.
# Install as /etc/sysctl.d/99-ramshield-synproxy.conf and apply with sysctl --system.
# nf_conntrack_tcp_loose=0 is appropriate only when the host traffic path is
# compatible with strict conntrack validation.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_timestamps = 1
net.netfilter.nf_conntrack_tcp_loose = 0
