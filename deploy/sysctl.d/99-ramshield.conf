# RamShield production kernel tunables
# Install as /etc/sysctl.d/99-ramshield.conf and apply with sysctl --system
#
# These settings optimize the host for high-throughput packet processing,
# XDP/eBPF map performance, and SYNPROXY conntrack stability.
#
# Apply: sudo sysctl --system
# Verify: sysctl -p /etc/sysctl.d/99-ramshield.conf

# TCP SYN cookies — defend against SYN flood when backlog overflows
net.ipv4.tcp_syncookies = 1

# TCP timestamps — required for PAWS and window scaling; enables accurate RTT
net.ipv4.tcp_timestamps = 1

# Increase conntrack table size for high connection rates
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_buckets = 262144

# Strict conntrack validation — prevents loose TCP state tracking
# Only enable if your traffic path is compatible (no asymmetric routing)
net.netfilter.nf_conntrack_tcp_loose = 0

# TCP FIN timeout — faster cleanup of closed connections
net.ipv4.tcp_fin_timeout = 10

# TCP keepalive — detect dead peers faster
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 5

# Increase socket buffer limits for high-throughput paths
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 262144 33554432
net.ipv4.tcp_wmem = 4096 262144 33554432

# Increase backlog for high connection rates
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Disable IPv6 if not used (reduces attack surface)
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1

# BPF JIT — must be enabled for eBPF performance
net.core.bpf_jit_enable = 1

# ICMP rate limiting — prevent amplification
net.ipv4.icmp_ratelimit = 1000
net.ipv4.icmp_ratemask = 6168

# ARP table thresholds — prevent ARP flooding
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096