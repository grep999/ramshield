apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ramshield-node-guard
  namespace: ramshield
  labels:
    app.kubernetes.io/name: ramshield
    app.kubernetes.io/component: node-guard
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ramshield
      app.kubernetes.io/component: node-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramshield
        app.kubernetes.io/component: node-guard
    spec:
      serviceAccountName: ramshield
      # hostNetwork: required so XDP attaches to the host interface and so
      # liveness/readiness probes to 127.0.0.1 reach the daemon's loopback bind.
      # See deploy/k8s/CAPS.md (I-012).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # XDP attaches to the host interface; the daemon must see the host
      # network namespace and its pinned BPF prefix.
      tolerations:
        - operator: Exists
      containers:
        - name: ramshield
          image: ghcr.io/grep999/ramshield:0.6.0-node
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/ramshield/config.toml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add:
                # Capability rationale (I-012) — each retained capability is
                # required by the XDP / capture path and nothing else.
                # Full write-up: deploy/k8s/CAPS.md
                # - NET_ADMIN: attaching the XDP program to the interface
                #   (netlink IFLA_XDP) requires it; unprivileged attach is refused.
                # - BPF: bpf() syscalls that create/update the pinned maps
                #   under /sys/fs/bpf (unprivileged bpf() cannot create maps).
                # - PERFMON: packet path tracing via perf_event_open.
                # - NET_RAW: AF_PACKET / TPACKET_V3 native_ingest sockets.
                # Filesystem access comes from the explicit hostPath mounts
                # below; no other capability is granted.
                - NET_ADMIN
                - BPF
                - PERFMON
                - NET_RAW
            # BPF map creation needs CAP_BPF; drop everything else the
            # container does not need.
            allowPrivilegeEscalation: false
          env:
            - name: RUST_LOG
              value: "info,ramshield=debug"
            - name: RAMSHIELD_DASHBOARD__ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: ramshield-admin
                  key: argon2-hash
                  optional: false  # the dashboard binds 127.0.0.1:9999 — auth is mandatory
            - name: RAMSHIELD_IPC__AUTH_KEYS
              valueFrom:
                secretKeyRef:
                  name: ramshield-admin
                  key: ipc-auth-key
                  optional: false
          ports:
            - name: ipc
              containerPort: 7890
              protocol: TCP
            - name: dashboard
              containerPort: 9999
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "2Gi"
          # The node ConfigMap binds the dashboard on 127.0.0.1, so a
          # probe without `host` connects to the pod IP and never reaches
          # it. With hostNetwork the pod shares the host's network
          # namespace, so 127.0.0.1 is the daemon's own listener.
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /livez
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: 9999
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/ramshield
              readOnly: true
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              # HostToContainer, not Bidirectional. Bidirectional requires
              # `privileged: true`, and the API server refuses the
              # combination, so the DaemonSet was never admitted. The
              # volume is the host's own /sys/fs/bpf, so the pins the
              # container creates land in the host's bpffs and the other
              # pods see them - no mount propagation is needed for that.
              mountPropagation: HostToContainer
            - name: shm
              mountPath: /dev/shm
            - name: wal-data
              mountPath: /var/lib/ramshield
      volumes:
        - name: config
          configMap:
            name: ramshield-node-config
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: wal-data
          hostPath:
            path: /var/lib/ramshield
            type: DirectoryOrCreate
