apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramshield
  namespace: ramshield
  labels:
    app.kubernetes.io/name: ramshield
    app.kubernetes.io/component: server
spec:
  replicas: 1   # see deploy/k8s/README.md — single-replica until WAL supports a shared backend
  strategy:
    type: Recreate  # RWO PVC is authoritative WAL storage
  selector:
    matchLabels:
      app.kubernetes.io/name: ramshield
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramshield
        app.kubernetes.io/component: server
    spec:
      hostNetwork: false
      dnsPolicy: ClusterFirst
      serviceAccountName: ramshield
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532     # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ramshield
          image: ghcr.io/grep999/ramshield:0.6.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/ramshield/config.toml"]
          ports:
            - name: ipc
              containerPort: 7890
              protocol: TCP
            - name: dashboard
              containerPort: 9999
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,ramshield=debug"
            - name: RAMSHIELD_DASHBOARD__ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: ramshield-admin
                  key: argon2-hash
                  optional: false
            # Required when ipc.tcp_addr is public; Config validation fails closed
            # if this key is absent. Format: key-id:hex-secret[,key-id:hex-secret]
            - name: RAMSHIELD_IPC__AUTH_KEYS
              valueFrom:
                secretKeyRef:
                  name: ramshield-admin
                  key: ipc-auth-key
                  optional: false

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"   # matches ConfigMap ram_limit_mb; tight, intentional
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The daemon binds the dashboard on 127.0.0.1 (the ConfigMap's
          # http_addr), so a probe without `host` connects to the pod IP and
          # never reaches it: the pod never became Ready and the kubelet
          # killed it.
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: dashboard
            initialDelaySeconds: 2
            periodSeconds: 5
          startupProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: dashboard
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /livez
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ramshield
              readOnly: true
            - name: wal
              mountPath: /var/lib/ramshield/wal
      volumes:
        - name: config
          configMap:
            name: ramshield-config
        - name: wal
          persistentVolumeClaim:
            claimName: ramshield-wal
      terminationGracePeriodSeconds: 15
