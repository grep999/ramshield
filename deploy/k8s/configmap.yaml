apiVersion: v1
kind: ConfigMap
metadata:
  name: ramshield-config
  namespace: ramshield
  labels:
    app.kubernetes.io/name: ramshield
data:
  config.toml: |
    # Ordinary server deployment: control surfaces stay loopback-only.
    # Use kubectl port-forward or an explicitly configured TLS/mTLS proxy.
    # The node-guard DaemonSet uses ramshield-node-config instead.
    [engine]
    shard_count = 256
    worker_threads = 0
    ram_limit_mb = 1536  # 2Gi container — leave ~512 MiB headroom for runtime/allocator/WAL

    [ipc]
    tcp_addr = "127.0.0.1:7890"
    max_connections = 1024

    [dashboard]
    enabled = true
    http_addr = "127.0.0.1:9999"

    [forecasting]
    enabled = true
    ewma_alpha = 0.3
    hw_beta = 0.1
    hw_gamma = 0.1
    seasonality_period = 60
    anomaly_zscore = 3.0
    min_entropy = 4.5

    [wal]
    enabled = true
    dir = "/var/lib/ramshield/wal"
    durability = "GroupCommit"
    compress = true
    seg_max_bytes = 67108864
    retention_max_bytes = 536870912

    # XDP stays off in-cluster (pod mode). Hosts: use a config with
    # xdp.enabled=true.
    [xdp]
    enabled = false
