apiVersion: v1
kind: ConfigMap
metadata:
  name: ramshield-config
  namespace: ramshield
  labels:
    app.kubernetes.io/name: ramshield
data:
  config.toml: |
    # RamShield config — K8s overlay
    # IPC + dashboard bind to 0.0.0.0 inside the pod; rely on Service selectors
    # (not the pod IP) for traffic steering.
    [engine]
    shard_count = 256
    worker_threads = 0
    ram_limit_mb = 2048

    [ipc]
    tcp_addr = "0.0.0.0:7890"
    max_connections = 4096

    [dashboard]
    enabled = true
    http_addr = "0.0.0.0:7891"

    [forecasting]
    enabled = true
    ewma_alpha = 0.3
    hw_beta = 0.1
    hw_gamma = 0.1
    seasonality_period = 60
    anomaly_zscore = 3.0
    min_entropy = 4.5

    [wal]
    enabled = true
    dir = "/var/lib/ramshield/wal"
    durability = "GroupCommit"
    compress = true
    seg_max_bytes = 67108864
    retention_max_bytes = 536870912

    # XDP stays off in-cluster. See deploy/k8s/README.md.
    [xdp]
    enabled = false
