apiVersion: v1
kind: ServiceAccount
metadata:
  name: ramshield
  namespace: ramshield
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ramshield-config-reader
  namespace: ramshield
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ramshield-config"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ramshield
  namespace: ramshield
subjects:
  - kind: ServiceAccount
    name: ramshield
    namespace: ramshield
roleRef:
  kind: Role
  name: ramshield-config-reader
  apiGroup: rbac.authorization.k8s.io
