# Prometheus alert rules for RamShield.
#
# These rules are a companion to the metrics crate. They cover the three
# failure modes that matter in production and have no other signal path:
#
#   1. XDP reconciliation drift — the kernel map is out of sync with userspace.
#   2. Bloom saturation — the advisory cache is chronically undersized.
#   3. Dashboard auth lockout — the login path is failing.
#
# All three are gauges or counters that the enforcement/detection tick
# loops update on every 250 ms cycle, so they are always current.
#
# Copy to /etc/ramshield/alerts.yml and reference from the Prometheus
# scrape config (scrape_interval: 10s, evaluation_interval: 10s).

groups:
  - name: ramshield_xdp_reconciliation
    rules:
      - alert: RamShieldReconcileStale
        expr: |
          ramshield_xdp_reconcile_age_seconds > 300
        for: 60s
        labels:
          severity: critical
          summary: "XDP map has not been reconciled in >5m"
          description: |
            The enforcement service's periodic store→XDP reconciliation has
            not succeeded for over 300 seconds. The kernel block list may be
            stale (blocked IPs passing, unblocked IPs dropped). Check the
            enforcement service logs for reconcile errors and verify the
            XDP program is still attached.
          dashboard_url: https://localhost:3000/d/ramshield-xdp

      - alert: RamShieldReconcileFailing
        expr: |
          rate(ramshield_xdp_reconcile_failures_total[5m]) > 0
        for: 30s
        labels:
          severity: warning
          summary: "XDP reconciliation attempts are failing"
          description: |
            The enforcement service is attempting periodic reconciliation
            and failing. This is usually a transient XDP attach issue, but
            if it persists it means the kernel map is diverging from
            userspace state.

  - name: ramshield_bloom
    rules:
      - alert: RamShieldBloomSaturation
        expr: |
          rate(ramshield_bloom_saturation_clears_total[5m]) > 0
        for: 0s
        labels:
          severity: warning
          summary: "Bloom filter is saturating"
          description: |
            The advisory bloom cache has hit the n≥m/20 saturation threshold
            and triggered a clear. A single event is normal (a burst of
            promotes); sustained firing means the bloom is too small for the
            promotion rate and should be resized in config.

  - name: ramshield_dashboard
    rules:
      - alert: RamShieldAuthLoginFailures
        expr: |
          rate(ramshield_auth_login_failures_total[5m]) > 5
        for: 30s
        labels:
          severity: warning
          summary: "Dashboard login failures exceeding threshold"
          description: |
            More than 5 failed dashboard login attempts in 5 minutes. This
            may be a credential leak, a misconfigured operator, or a
            brute-force attempt. The session store throttles repeated
            failures; if this alert fires repeatedly, review the source.

      - alert: RamShieldCsrfBlocked
        expr: |
          rate(ramshield_csrf_blocked_total[5m]) > 0
        for: 0s
        labels:
          severity: info
          summary: "Cross-origin dashboard request blocked"
          description: |
            A dashboard API request was rejected because the Origin/Referer
            did not match the bind host. This is the CSRF guard doing its
            job. If it fires for legitimate operators, check the proxy
            configuration — the Origin header may be stripped or rewritten.