# config.baseline.toml — THE canonical template. Every config in this repo
# derives from it; hand-rolled per-harness configs are forbidden.
# Covers every field of Config (crates/ramshield-config).
#
# !!! TRIAL / DEV DEFAULTS — READ BEFORE PRODUCTION USE !!!
# 1. ipc.auth_keys contains a PUBLIC development HMAC key.
#    Replace it (or set RAMSHIELD_IPC__AUTH_KEYS) before any real deployment.
# 2. xdp.enabled = false. Set true + a real interface for kernel enforcement.
# 3. wal.dir points at /tmp/... — change to persistent storage for production.
# 4. dashboard and ipc bind to 127.0.0.1 only. Do not expose without TLS + auth.
#
# Harnesses (suite e2e, stress) generate scratch configs from this file with
# surgical overrides only (ports, wal.dir, xdp toggle). Never copy-paste a
# whole config again — one source of truth.
#
# Full walkthrough: docs/QUICKSTART.md

# ─────────────────────────────────────────────────────────────────────────────
# [engine] — Worker pool & RAM budget
# Controls the Tokio async runtime and memory ceiling.
# ─────────────────────────────────────────────────────────────────────────────
[engine]
# 0 = all cores (Tokio auto). Pin an integer only on fixed-shape nodes.
worker_threads = 0
# Hard store budget in MB. Validation requires >= 64. Raise for production.
ram_limit_mb = 1024
# Lock-free shard fanout for the store. Must be a power of two.
shard_count = 256

# ─────────────────────────────────────────────────────────────────────────────
# [detection] — Attack detection thresholds & tuning
# ─────────────────────────────────────────────────────────────────────────────
[detection]
rps_threshold = 500
rate_window_secs = 10
promote_min_events = 4
relative_factor = 3.0
relative_floor_rps = 50.0
relative_min_samples = 8
relative_min_breaches = 3
bloom_bits = 8_388_608
batch_max_events = 4096
batch_window_ms = 25
batch_channel_capacity = 64_000
subnet_batch_threshold = 64
subnet_batch_min_events = 200
batch_block_enabled = true
pre_aggs_flush_interval_ms = 250
pre_aggs_max_size = 1_000_000
l7_enabled = false
l7_rps_threshold = 500
l7_http2_min_streams = 32
l7_http2_reset_ratio_pct = 80
l7_block_ttl_secs = 600

# ─────────────────────────────────────────────────────────────────────────────
# [xdp] — Kernel dataplane
# ─────────────────────────────────────────────────────────────────────────────
[xdp]
enabled = false
interface = "eth0"
mode = "drv"
allow_inband_fallback = true
require_native_for_autonomous = true
require_rss_rebalance = true
trusted_overlay_cidrs = []

# ─────────────────────────────────────────────────────────────────────────────
# [ipc] — Local control plane & authentication
# ─────────────────────────────────────────────────────────────────────────────
[ipc]
tcp_addr = "127.0.0.1:7890"
max_connections = 128
max_line_length = 262_144
max_connection_bytes = 1_048_576
read_timeout_ms = 5000
write_timeout_ms = 5000
connection_idle_timeout_ms = 30_000
auth_keys = ["k1:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]
key_roles = [{ key_id = "k1", role = "Admin" }]
require_auth = true
require_auth_for_mutations = true

# ─────────────────────────────────────────────────────────────────────────────
# [dashboard] — Web UI & observability
# ─────────────────────────────────────────────────────────────────────────────
[dashboard]
enabled = true
http_addr = "127.0.0.1:9999"
block_log_size = 1_000
admin_password_hash = ""
require_auth_for_config = true
session_ttl_secs = 28_800
max_login_attempts = 50
max_password_length = 1024
trusted_proxies = []
tls_enabled = false

# ─────────────────────────────────────────────────────────────────────────────
# [wal] — Crash-durable persistence
# ─────────────────────────────────────────────────────────────────────────────
[wal]
enabled = true
dir = "/tmp/ramshield-wal"
durability = "GroupCommit"
compress = true
seg_max_bytes = 67_108_864
retention_max_bytes = 1_073_741_824
allow_volatile_fallback = false

# ─────────────────────────────────────────────────────────────────────────────
# [forecasting]
# ─────────────────────────────────────────────────────────────────────────────
[forecasting]
enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# [mesh]
# ─────────────────────────────────────────────────────────────────────────────
[mesh]
enabled = false
peer_node_ids = []
peer_auth_keys = []

# ─────────────────────────────────────────────────────────────────────────────
# [upstream]
# ─────────────────────────────────────────────────────────────────────────────
[upstream]
enabled = false

# ─────────────────────────────────────────────────────────────────────────────
# [autonomous]
# ─────────────────────────────────────────────────────────────────────────────
[autonomous]
enabled = false
syn_pps_per_cpu = 25000
udp_pps_per_cpu = 50000
packet_pps_per_cpu = 200000
window_ms = 100

# ─────────────────────────────────────────────────────────────────────────────
# [native_ingest]
# ─────────────────────────────────────────────────────────────────────────────
[native_ingest]
enabled = false
interface = "eth0"
max_events_per_sec = 20000

# ─────────────────────────────────────────────────────────────────────────────
# [synproxy]
# ─────────────────────────────────────────────────────────────────────────────
[synproxy]
enabled = false
ports = [22, 53, 80, 443]
mss = 1460
wscale = 7
max_connections_per_source = 128
max_connections_total = 16384
new_connections_per_second = 50
new_connection_burst = 100
new_connections_total_per_second = 2000
new_connection_total_burst = 4000
