---
# DEPLOY — build, install, start (systemd or k8s)
# Vars: deploy_mode (systemd | k8s), dashboard_port, deploy_host
#       deploy_build (bool, default true) — set false to skip the release build
- name: Build release artifact
  command: cargo build --release --locked --features full
  args:
    chdir: "{{ project_dir }}"
  register: build_result
  changed_when: true
  failed_when: build_result.rc != 0
  when: (deploy_build | default('true')) | bool

- name: Assert binary produced
  stat:
    path: "{{ project_dir }}/target/release/ramshield"
  register: artifact

- name: Fail if binary missing
  assert:
    that: artifact.stat.exists
    fail_msg: "Build succeeded but binary not at target/release/ramshield"

# SYSTEMD PATH
- name: Install systemd binary
  copy:
    src: "{{ project_dir }}/target/release/ramshield"
    dest: /usr/local/bin/ramshield
    mode: '0755'
  when: deploy_mode == "systemd"

- name: Copy prod config to host
  copy:
    src: "{{ project_dir }}/config.prod.toml"
    dest: /etc/ramshield/config.toml
    mode: '0640'
    # NOTE: config.prod.toml is gitignored (secrets). Must exist locally.
    #       Generate from config.baseline.toml + secret overrides before deploy.
  when: deploy_mode == "systemd"

- name: Daemon-reload systemd
  systemd:
    daemon_reload: true
  when: deploy_mode == "systemd"

- name: Start ramshield service
  systemd:
    name: ramshield
    state: started
    enabled: true
  when: deploy_mode == "systemd"

# K8S PATH — render manifests then apply
- name: Ensure rendered manifest directory exists
  file:
    path: "{{ project_dir }}/deploy/rendered"
    state: directory
    mode: '0755'
  when: deploy_mode == "k8s"

- name: Render k8s manifests with image tag
  template:
    src: k8s-deployment.yaml.j2
    dest: "{{ project_dir }}/deploy/rendered/deployment.yaml"
  when: deploy_mode == "k8s"

- name: Apply prerequisite k8s manifests in dependency order
  shell: >
    kubectl apply
    -f deploy/k8s/namespace.yaml
    -f deploy/k8s/configmap.yaml
    -f deploy/k8s/rbac.yaml
    -f deploy/k8s/ramshield-wal-pvc.yaml
  args:
    chdir: "{{ project_dir }}"
  when: deploy_mode == "k8s"

- name: Check operator-managed Secret ramshield-admin exists
  command: kubectl get secret ramshield-admin --namespace=ramshield -o name
  args:
    chdir: "{{ project_dir }}"
  register: secret_check
  changed_when: false
  failed_when: false
  when: deploy_mode == "k8s"

- name: Fail when operator-managed Secret is missing
  fail:
    msg: "Operator-managed Secret 'ramshield-admin' is missing in namespace 'ramshield'. Create it before deploying (keys: argon2-hash, ipc-auth-key). Never print secrets."
  when: deploy_mode == "k8s" and secret_check.rc != 0

- name: Apply k8s manifests
  shell: kubectl apply -f deploy/rendered/ --namespace=ramshield
  args:
    chdir: "{{ project_dir }}"
  environment:
    DOCKER_BUILDKIT: "1"
  when: deploy_mode == "k8s"

- name: Wait for deployment rollout readiness
  command: kubectl rollout status deployment/ramshield --namespace=ramshield --timeout=300s
  args:
    chdir: "{{ project_dir }}"
  when: deploy_mode == "k8s"

- name: Confirm deployment mode
  debug:
    msg: "DEPLOY_COMPLETE for {{ deploy_mode }}"
  when: deploy_mode == "k8s"
